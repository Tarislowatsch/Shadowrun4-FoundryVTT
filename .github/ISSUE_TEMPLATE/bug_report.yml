name: Bug Report
description: Report something that doesn't work as expected in the Shadowrun 4th Edition system.
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I reproduced this with no other Foundry modules enabled, or confirmed it still happens with only essential modules active.
          required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug, starting from a fresh scene/actor if relevant.
      placeholder: |
        1. Create a character with...
        2. Open the sheet and...
        3. Click...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: system-version
    attributes:
      label: Shadowrun 4th Edition system version
      description: Found under Game Settings > Manage Modules, or in system.json.
      placeholder: e.g. 1.23.1
    validations:
      required: true

  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      placeholder: e.g. 14.315
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Where does this happen?
      options:
        - Foundry desktop app
        - Browser (Chrome/Edge)
        - Browser (Firefox)
        - Browser (other)
        - Not sure
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open the browser/app console (F12) and paste any red error output here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Other active modules, screenshots, or anything else that might be relevant.
    validations:
      required: false
