name: Feature Request
description: Suggest an improvement or a new feature for the Shadowrun 4th Edition system.
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or limitation you're running into.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Rulebook references, screenshots, or anything else that might be relevant.
    validations:
      required: false
